# Version web du jeu, publiée sur GitHub Pages à chaque poussée sur main :
# tests headless, puis export Web (sans threads : GitHub Pages ne peut pas
# envoyer les en-têtes d'isolation qu'exigerait la version avec threads).
name: Version web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # write : pousser la version exportée sur la branche « netlify » (voir netlify/).
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7-stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Godot et modèles d'export (cache)
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web-threads

      - name: Télécharger Godot et le modèle Web
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates/4.7.stable
          cd ~/godot
          base=https://github.com/godotengine/godot-builds/releases/download/$GODOT_VERSION
          curl -sSL -o g.zip "$base/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q g.zip && rm g.zip && mv Godot_v*_linux.x86_64 godot
          curl -sSL -o t.tpz "$base/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q t.tpz "templates/web_nothreads_release.zip" "templates/web_release.zip" "templates/version.txt"
          mv templates/* ~/.local/share/godot/export_templates/4.7.stable/
          rm -r templates t.tpz

      - name: Import et tests
        run: |
          ~/godot/godot --headless --path . --import
          # Une erreur de script peut laisser le banc finir sans avoir tout joué :
          # on exige « TOUT PASSE » et aucune SCRIPT ERROR.
          ~/godot/godot --headless --path . --script res://tests/run_tests.gd 2>&1 | tee tests.log
          grep -q "TOUT PASSE" tests.log
          ! grep -q "SCRIPT ERROR" tests.log

      - name: Export Web
        run: |
          mkdir -p build/web/lite
          # Godot ne doit pas prendre le premier export pour des ressources du jeu.
          touch build/.gdignore
          # Numéro de version affiché sur l'écran titre (voir Hud).
          echo "${GITHUB_SHA::7}" > version.txt
          # Avec threads à la racine (Netlify envoie les en-têtes d'isolation),
          # sans threads dans /lite/ (secours : la page y bascule toute seule).
          ~/godot/godot --headless --path . --export-release "Web threads" build/web/index.html
          ~/godot/godot --headless --path . --export-release "Web" build/web/lite/index.html
          ls -la build/web

      # Netlify : la même version, avec netlify/netlify.toml, sur la branche
      # « netlify » (un seul commit remplacé à chaque fois). Voir netlify/README.md.
      - name: Branche netlify
        run: |
          cp netlify/netlify.toml build/web/
          cd build/web
          git init -q -b netlify
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Version web ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" netlify
          rm -rf .git

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  # GitHub Pages gratuit exige un dépôt public : si le dépôt passe en privé,
  # cette publication échoue sans bloquer le reste (Netlify est déjà servi par
  # la branche « netlify », poussée dans l'étape précédente).
  deploy:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
