# Netlify, si le site publie la branche « main » : on publie la version web
# déjà exportée par GitHub Actions sur la branche « netlify » (voir
# netlify/README.md). Le mieux reste de régler Netlify sur la branche
# « netlify » (toujours à jour ; « main » a une version de retard).

[build]
  publish = "dist"
  command = "sh netlify/fetch_build.sh"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"
    # Isolation : permet la version « avec threads » du jeu (son mixé sur son
    # propre fil, sans grésillement ; route construite en arrière-plan). Sans
    # ces en-têtes, ou sur un navigateur trop ancien, la page bascule sur /lite/.
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
